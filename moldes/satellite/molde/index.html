    <script>
      // ======================================================================================
      // Satellite (@creatoroly) clone. Every value is a pure function of the frame.
      // Integer output frame Fi picks what exists (hard switches); continuous F drives motion,
      // so round_mb.sh subframes blur only the motion (shutter = SHUTTER of a frame, measured).
      // ======================================================================================
      const FPS = 30, NF = 328, DUR = NF / FPS, SHUTTER = 0.3;
      const $ = (id) => document.getElementById(id);
      const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));

      // Catmull-Rom through keys: no velocity stop at inner keys (motion-feel rule 1)

        const p0 = keys[Math.max(i - 1, 0)], p1 = keys[i], p2 = keys[i + 1], p3 = keys[Math.min(i + 2, n - 1)];
        const t = (F - p1[0]) / (p2[0] - p1[0]);
        const m1 = ((p2[1] - p0[1]) / (p2[0] - p0[0] || 1)) * (p2[0] - p1[0]);
        const m2 = ((p3[1] - p1[1]) / (p3[0] - p1[0] || 1)) * (p2[0] - p1[0]);
        const t2 = t * t, t3 = t2 * t;
        return (2 * t3 - 3 * t2 + 1) * p1[1] + (t3 - 2 * t2 + t) * m1 + (-2 * t3 + 3 * t2) * p2[1] + (t3 - t2) * m2;
      }
      // ---- measured tracks (tools/mktracks.py): fill gaps once, then sample with linear interpolation
      const TRK = window.TR;
      for (const k in TRK) {
        const v = TRK[k].v; if (!v) continue;
        let last = null; for (let i = 0; i < v.length; i++) { if (v[i] == null) v[i] = last; else last = v[i]; }
        last = null; for (let i = v.length - 1; i >= 0; i--) { if (v[i] == null) v[i] = last; else last = v[i]; }
      }
      function tr(name, F, i) {
        const t = TRK[name], n = t.v.length, x = clamp(F - t.a, 0, n - 1), j = Math.floor(x), k = x - j;
        const A = t.v[j], B = t.v[Math.min(j + 1, n - 1)];
        const a = i == null ? A : A[i], b = i == null ? B : B[i];
        return a + (b - a) * k;
      }
      const hex = (h) => [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
      const mixc = (a, b, t) => a.map((v, i) => Math.round(lerp(v, b[i], t)));
      const rgb = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
      function el(tag, css, parent, html) { const e = document.createElement(tag); if (css) e.style.cssText = css; if (html != null) e.innerHTML = html; parent.appendChild(e); return e; }
      const div = (css, p, html) => el("div", css, p, html);
      const show = (e, on) => { e.style.display = on ? "block" : "none"; };
      const blurf = (b) => (b > 0.05 ? `blur(${b.toFixed(2)}px)` : "none");
      const stage = $("stage");

      // ======================================================================================
      // MOLDE: swappable assets (data-composition-variables on <html>), read once.
      // Defaults are the clone, and every swap below is the identity at its default,
      // so a render with the defaults is the clone frame for frame.
      // ======================================================================================
      const DECL = JSON.parse(document.documentElement.getAttribute("data-composition-variables"));
      const DEF = Object.fromEntries(DECL.map((d) => [d.id, d.default]));
      const HFV = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
      const V = Object.assign({}, DEF, HFV);
      // -- colour: hue rotation in OKLCH towards the new colour. Lightness and chroma keep their place
      //    in the measured palette (pale washes stay pale, the reference colour lands exactly on the new one)
      const lin = (c) => (c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4);
      const gam = (c) => (c <= 0.0031308 ? 12.92 * c : 1.055 * c ** (1 / 2.4) - 0.055);
      function toLch(c) {
        const [r, g, b] = c.map((v) => lin(v / 255));
        const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b), m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b), s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
        const A = 1.9779984951 * l - 2.428592205 * m + 0.4505937099 * s, B = 0.0259040371 * l + 0.7827717662 * m - 0.808675766 * s;
        return [0.2104542553 * l + 0.793617785 * m - 0.0040720468 * s, Math.hypot(A, B), (Math.atan2(B, A) * 180) / Math.PI];
      }
      function fromLch(L, C, h) { // linear sRGB, may be out of gamut
        const A = C * Math.cos((h * Math.PI) / 180), B = C * Math.sin((h * Math.PI) / 180);
        const l = (L + 0.3963377774 * A + 0.2158037573 * B) ** 3, m = (L - 0.1055613458 * A - 0.0638541728 * B) ** 3, s = (L - 0.0894841775 * A - 1.291485548 * B) ** 3;
        return [4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s, -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s, -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s];
      }
      const outG = (x) => x.some((v) => v < -1e-4 || v > 1 + 1e-4);
      function lchRgb(L, C, h) { // out of sRGB: lower the chroma until it fits (keeps lightness and hue)
        let x = fromLch(L, C, h);

        return x.map((v) => Math.round(clamp(gam(clamp(v))) * 255));
      }
      function recolor(ref, to, band) {
        const id = (c) => c; id.s = (s) => s;
        if (ref.toLowerCase() === to.toLowerCase()) return id;
        const A = toLch(hex(ref.slice(1))), B = toLch(hex(to.slice(1)));
        const dh = ((B[2] - A[2] + 540) % 360) - 180, kc = B[1] / A[1], dl = B[0] - A[0], memo = new Map();
        const f = (c) => {
          const key = c.join(","); if (memo.has(key)) return memo.get(key);
          const [L, C, h] = toLch(c);
          const w = (band ? band((h + 360) % 360) : 1) * clamp((C - 0.005) / 0.015); // greys have no hue to turn
          const o = w <= 0 ? c : lchRgb(L + w * Math.min(1, C / A[1]) * dl, C * (1 + w * (kc - 1)), h + w * dh);
          memo.set(key, o); return o;
        };
        const h2 = (c) => "#" + c.map((v) => v.toString(16).padStart(2, "0")).join("");
        f.s = (s) => s.replace(/#([0-9a-fA-F]{6})\b/g, (q, x) => h2(f(hex(x)))).replace(/rgb(a?)\((\d+),\s*(\d+),\s*(\d+)/g, (q, a, r, g, b) => `rgb${a}(${f([+r, +g, +b]).join(",")}`);
        f.on = true;
        return f;
      }
      const GREENS = (h) => clamp(Math.min((h - 115) / 10, (185 - h) / 13)); // the measured greens sit at OKLCH hue 133-175; teal/cyan/blue stay
      const G = recolor(DEF.cor_principal, V.cor_principal, GREENS), PT = recolor(DEF.cor_ponto, V.cor_ponto);
      const RR = recolor(DEF.cor_rota, V.cor_rota), RB = recolor(DEF.cor_botao, V.cor_botao);
      const GK = (keys) => keys.map((k) => [k[0], G(k[1])]);
      // -- pieces and motion (the defaults take the clone's own code path)
      const ANEL = V.peca_cartao === "anel", RADAR = V.peca_mapa === "radar", BAIXO = V.entrada_lista === "baixo", DESF = V.entrada_titulo === "desfoque";
      const KM = V.mola === "firme" ? 0.6 : 1;
      // firm spring = time reparametrisation of one entry: from its beat b it runs 1/0.6 faster and is settled at
      // b + 0.6 L, then holds its settled value until b + L, where it rejoins the clock (the beat start never moves)
      const mola = (F, b, L) => (KM === 1 || F <= b || F >= b + L ? F : b + Math.min(L, (F - b) / KM));
      // -- fonte: every measured weight stays (title 550, pill 500, button 590, island 500/400); layout is redone from the text
      const FAM = { sf: '"SF Pro"', archivo: '"Archivo"', inter: '"Inter"' }[V.fonte];
      const SFF = (font) => font.replace(FAM, '"SF Pro"'); // the same text in SF Pro: what the clone's boxes were sized for
      // a line-height:1 box puts the baseline at (1 + ascent - descent) / 2 em (hhea). 0.855 is the clone's SF Pro value;
      // the brand fonts keep the same baseline, so they shift by their own metric difference (Archivo .878/.21, Inter .969/.241, SF .967/.211)
      const BL = 0.855 + { sf: 0, archivo: (0.878 - 0.21 - 0.9668 + 0.2109) / 2, inter: (0.96875 - 0.2412 - 0.9668 + 0.2109) / 2 }[V.fonte];
      if (V.fonte !== "sf") $("root").style.fontFamily = `${FAM}, "Apple Color Emoji", sans-serif`;
      // -- formato 9:16: the square scene sits in the Reels safe band (top 220 px and bottom third free), centred on y 750;
      //    the measured background fields stretch to fill the whole 1080x1920 screen
      const VERT = V.formato === "9:16", OY = VERT ? 210 : 0, HH = VERT ? 1920 : 1080;
      if (VERT) stage.style.top = OY + "px";

          if (a === b || t <= 0) { put(eOld, a, x, din, oin, bin); put(eNew, "", x, 0, 0, 0); return; }
          const bl = 7 * Math.sin(Math.PI * t);
          put(eOld, a, x, -46 * t, 1 - t, bl); put(eNew, b, x, 46 * (1 - t), t, bl);
        };
        for (let i = 0; i < T0.length; i++) {
          const [o, d, bl] = inT(i), spec = F < (lag(i) === 0 ? 250 : 243) ? tick(T0, T1, 239, i) : tick(T1, T2, 256, i);
          roll(DO[i], DN[i], spec, CLK.x[i], d, o, bl);
        }
      }

      function drawBubble(F, Fi) {
        const on = Fi >= 277; show(bubble, on); if (!on) return;
        const cx = tr("bubble", F, 0), cy = tr("bubble", F, 1), ang = tr("bubble", F, 2), len = tr("bubble", F, 3);
        const s = F < 278 ? 0.4 : clamp(len / 401, 0.3, 1.2) * (F < 281 ? kf(F, [[278, 1.2], [281, 1]]) : 1);
        bubble.style.transform = `translate(${cx + 2.2 - 184 - BDX / 2}px,${cy - 84}px) rotate(${ang}deg) scale(${s})`;
        bubble.style.opacity = kf(F, [[277, 0], [278.5, 1]], E.lin);
        bubble.style.filter = blurf(kf(F, [[277, 8], [279, 6], [281, 2.5], [283, 0.8], [285, 0]], E.lin));
        bText.style.top = 100 - BL * 47.5 + "px";
        const shn = kf(F, [[280, 0], [282, 0.9], [287, 0.7], [290, 0]], E.lin), sx = kf(F, [[280, 0.05], [290, 0.95]], E.lin);
        sh[0].setAttribute("offset", clamp(sx - 0.2, 0, 1)); sh[1].setAttribute("offset", clamp(sx, 0, 1)); sh[2].setAttribute("offset", clamp(sx + 0.2, 0, 1));
        sh.forEach((e, i) => e.setAttribute("stop-opacity", shn * (i === 1 ? 0.95 : 0.55)));
      }

      // ======================================================================================
      function draw(t) {
        let Fi = Math.min(NF - 1, Math.floor(t * FPS + 1e-4));
        const frac = t * FPS - Fi, shift = (window.MB_SHIFT || 0) * FPS;
        let F = Fi + (frac - shift) * SHUTTER;
        if (WARP) { F = WARP(F); Fi = WARP(Fi); } // ritmo "batidas": output frame -> clone frame (the shutter scales with the local speed)
        if (!fitDone) fitAll();
        drawBackground(F, Fi);
        const FB = mola(mola(mola(F, 5, 19), 30, 21), 86, 22); // firm spring: icon, card and tile entries
        drawEarth(F, Fi, F); // the globe/radar exit and its glow keep the clone's clock
        drawBox(FB, Fi, F);
        drawLabel(mola(F, 11, 11), Fi);
        drawList(F, Fi);
        drawRoute(F, Fi);
        drawIsland(F, Fi);
        drawBubble(mola(F, 277, 23), Fi);
      }
      const P = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.to(P, { t: DUR, duration: DUR, ease: "none", onUpdate: () => draw(P.t) }, 0);
      window.addEventListener("hf-seek", (e) => draw(e.detail.time));
      if (V.fonte !== "sf") document.fonts.load(`500 40px ${FAM}`); // starts the brand font now, so fonts.ready waits for it
      document.fonts.ready.then(() => { layoutDone = false; CLK = null; fitDone = false; draw(P.t); });
      draw(0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
