        remGlow.style.opacity = kf(F, [[213, 0], [218, 1, E.lin]]);
        for (const b of BTN) {
          const pr = prog(F, b.t, b.t + 5, E.out2);
          b.e.style.opacity = kf(F, [[b.t - 0.5, 0], [b.t + 2.5, 1, E.lin]]);
          b.e.style.transform = `scale(${0.7 + 0.3 * pr})`;
          b.e.style.filter = blurf(8 * (1 - pr));
          const m = ink(b.label, 29, 590); // a new label is centred on the clone's baseline (lf < 1 only when the row is full)
          placeInk(b.lb, b.w / 2 - (m.r - m.l) * b.lf / 2, 91 + (ink(b.label0, 29, 590).a - m.a * b.lf), b.lf);
        }
        drawCursor(F, Fi);
        drawObjects(F, Fi);
      }
      function drawCursor(F, Fi) {
        if (!(Fi >= 193 && Fi <= 286)) return;
        let x, y;
        if (F < 194) { x = 945 + (194 - F) * 70; y = 1040; }
        else if (F > EXIT0) { const q = rideMenu(F, tr("cursor", EXIT0, 0), tr("cursor", EXIT0, 1)); x = q.x; y = q.y; }
        else { x = tr("cursor", F, 0); y = tr("cursor", F, 1); }
        // arrow lies on its side while it flies in (bbox 69x50 at f201), uprights by f222
        const rot = kf(F, [[193, -62], [201, -50, E.lin], [212, -12, E.out2], [222, 0, E.out2], [262, 0], [274, -8, E.sine]]);
        const sc = kf(F, [[193, 1.25], [200, 1.1, E.lin], [204, 0.95, E.out2], [262, 0.95], [276, 0.95]]);
        const rad = rot * Math.PI / 180;
        // the tip is the svg origin (2,1.5)*2.5; for a rotated arrow the bbox top-left is below-left of the tip
        const dy = rot < 0 ? -Math.sin(rad) * 0 : 0;
        cursor.style.transform = `translate(${x - 5}px,${y - 4 + (rot < 0 ? 60 * Math.sin(-rad) * 0.55 : 0)}px) rotate(${rot}deg) scale(${sc})`;
        const dark = 1; // standard white arrow with a dark outline throughout (on the white list it reads as a dark smear)
        curPath.setAttribute("fill", rgb(mixc([20, 20, 20], [255, 255, 255], dark)));
        curPath.setAttribute("stroke", rgb(mixc([255, 255, 255], [17, 17, 17], dark)));
        cursor.style.filter = blurf(kf(F, [[262, 0], [272, 3, E.in2], [286, 12, E.lin]]));
        cursor.style.opacity = kf(F, [[193, 0], [194.5, 1, E.lin], [280, 1], [288, 0, E.lin]]);
      }
      function drawObjects(F, Fi) {
        const OP = [[[209, 0], [213, 1, E.lin], [238, 0.81], [245, 0.56, E.lin], [249, 0.35, E.lin], [251, 0.2, E.lin], [255, 0, E.lin]],
                    [[209, 0], [213, 1, E.lin], [232, 1], [234, 0.81, E.lin], [236, 0.7, E.lin], [238, 0.55, E.lin], [240, 0.3, E.lin], [242, 0, E.lin]],
                    [[209, 0], [213, 1, E.lin], [238, 0.85], [245, 0.53, E.lin], [249, 0.36, E.lin], [251, 0.27, E.lin], [254, 0, E.lin]],
                    [[209, 0], [213, 1, E.lin], [238, 0.88], [245, 0.65, E.lin], [249, 0.47, E.lin], [251, 0.3, E.lin], [255, 0, E.lin]]];
        objField.style.opacity = kf(F, [[209, 0], [214, 1, E.lin], [238, 1], [252, 0, E.lin]]);
        OBJ.forEach((o, i) => {
          let cx, cy;
          if (F < 215) { const k = (215 - F); cx = tr("objects", 215, i) ? TRK.objects.v[0][i][0] : 0; cy = TRK.objects.v[0][i][1] - k * k * 1.6; }
          else if (F > 246) { const v = TRK.objects.v[TRK.objects.v.length - 1][i] || [0, 0]; const d = F - 246; cx = v[0] + (i === 0 ? -1.2 : i === 3 ? 2.5 : 0) * d; cy = v[1] + 3.2 * d; }
          else { const j = Math.floor(F - 215), t = F - 215 - j; const A = TRK.objects.v[j][i], B = TRK.objects.v[Math.min(j + 1, TRK.objects.v.length - 1)][i] || A; cx = lerp(A[0], B[0], t); cy = lerp(A[1], B[1], t); }
          o.e.style.transform = `translate(${cx - o.w / 2}px,${cy - o.h / 2}px)`;
          o.e.style.opacity = kf(F, OP[i]);
          o.g.style.transform = `translate(${cx - 170}px,${cy - 170}px)`;
          o.g.style.opacity = o.e.style.opacity;
          o.e.style.filter = blurf(kf(F, [[209, 10], [215, 2, E.out2], [218, 0, E.lin], [238, 0], [252, 9, E.in2]]));
        });
      }

      // where each subscription word sits inside the card subtitle (world units, cap top 265.7, ink-left 331)
      function subTarget(i, F, Fi) {
        const G = Math.max(F, 330), c = cardCam(G, Math.floor(G));
        MC.font = `450 76.6px "SF Pro"`;
        const pre = i ? SUBW.slice(0, i).join(" ") + " " : "";
        const off = pre ? MC.measureText(pre).width : 0;
        const mW = ink(SUB[i]._t, 82, 450), mS = ink(SUBW[0], 76.6, 450), cf = LAY.cfs;
        const sc = (76.6 / 82) * c.k * cf;
        // ink-left of word i = string ink-left + advance of the preceding text + this word's own ink offset
        const x = c.xL + (331 - mS.l * cf + off * cf) * c.k + mW.l * sc;
        return { x, capTop: c.cy + (265.7 - 261.3 + 0.7046 * 76.6 * (1 - cf)) * c.k, sc };
      }
      function drawSub(F, Fi) {
        const on = Fi >= 281 && Fi <= 336;
        show(subWrap, on); if (!on) return;
        const ST = [281, 283, 285.5];
        // molde: the phrase stays centred like the clone's line; LAY.pf shrinks it past 960 px
        const pf = LAY.pf, dW = (inkW(V.frase, 82, 450) * pf - inkW(DEF.frase, 82, 450)) / 2;
        SUB.forEach((w, i) => {
          let x0, x1, y0, sc;
          const j = SUBJ[i], st = SUBST[i], dd = st - ST[j];
          const m = ink(w._t, 82, 450), m0 = ink(SUBW0[j], 82, 450);
          // this word's offset from the original word j (scaled by the measured word scale): 0 at the defaults
          const PX = off(SUBW, i, 82, 450) * pf - off(SUBW0, j, 82, 450) - dW, PY = m0.a - m.a * pf;
          const fi = clamp(F, 281, 314);
          if (F >= st + 1) {
            const a = Math.floor(fi), t = fi - a;
            const A = TRK.subwords.v[a - 281], B = TRK.subwords.v[Math.min(a + 1 - 281, TRK.subwords.v.length - 1)];
            const words = (row) => row && row.filter((b) => b[6] - b[4] < 30); // drop the blue star box (B-R ~63; ink is grey)
            const pick = (row) => { const w3 = words(row); return w3 && w3.length === 3 ? w3[j] : null; };
            let pa = pick(A), pb = pick(B) || pa;
            if (!pa) pa = pb;
            if (pa) { x0 = lerp(pa[0], pb[0], t); x1 = lerp(pa[1], pb[1], t); y0 = lerp(pa[2], pb[2], t); }
          }
          if (x0 == null) {
            // before its first full measurement: drops in from above (measured ink tops f281-286)
            const dt = F - st;
            const yy = [940, 956, 941][j] - Math.max(0, 6 - dt) * 22;
            const xs = [[212, 321], [338, 469], [488, 881]][j];
            x0 = xs[0]; x1 = xs[1]; y0 = yy;
          }
          sc = (x1 - x0 + 1) / (m0.r - m0.l);
          if (F < 314) placeInk(w, x0 + PX * sc, y0 + PY * sc, sc * pf);
          else {
            // from f314 the whole line shrinks about x 317 (the start of "your"; ref word boxes f314-318 and line extents
            // f322-330: 667 px -> 471 -> 430 -> 397 -> 366 -> 353), sinks ~20 px into the card, then settles exactly on
            // the card subtitle (f326-331). The measured boxes after f314 are useless: the star and the blob merge in.
            const B = TRK.subwords.v[314 - 281][j], s0 = (B[1] - B[0] + 1) / (m0.r - m0.l);
            const S = kf(F, [[314, 1], [316, 0.965, E.lin], [318, 0.9, E.lin], [320, 0.8, E.lin], [322, 0.706, E.lin], [324, 0.645, E.lin], [326, 0.595, E.lin], [328, 0.549, E.lin], [330, 0.53, E.lin], [334, 0.516, E.lin]]);
            const xs = 317 + S * (B[0] + PX * s0 - 317), ys = 959 + S * (B[2] + PY * s0 - 959) + 20 * prog(F, 314, 330, E.sine);
            const cap = ys + (m.a - 0.7046 * 82) * s0 * pf * S; // ink top -> cap top for this word
            const tg = subTarget(i, F, Fi), v = prog(F, 326, 331, E.sine);
            placeCap(w, lerp(xs, tg.x, v), lerp(cap, tg.capTop, v), lerp(s0 * pf * S, tg.sc, v));
          }
          // ink fades into the card one word after another (measured ink level 30 -> 175: Get f319-325, your f321-326,
          // subscription f325-333); the light subtitle of the card takes over from f333
          const FO = [[[319, 1], [322, 0.6, E.lin], [325, 0.35, E.lin], [328, 0.12, E.lin], [331, 0, E.lin]],
                      [[321, 1], [324, 0.55, E.lin], [327, 0.3, E.lin], [330, 0.08, E.lin], [332, 0, E.lin]],
                      [[325, 1], [328, 0.55, E.lin], [331, 0.2, E.lin], [334, 0, E.lin]]][j];
          w.style.opacity = Math.min(kf(F, [[st, 0], [st + 2.5, 1, E.lin]]), kf(F, FO));
          const dk = [[286, 292], [288, 294], [290, 297]][j];
          w.style.color = rgb(mixc(SUBRED, [23, 22, 23], prog(F, dk[0] + dd, dk[1] + dd, E.sine)));
          w.style.filter = blurf(kf(F, [[st, 10], [st + 6, 3, E.out2], [st + 10, 0, E.lin], [318, 0], [322, 1.2, E.lin], [328, 1.5, E.lin]]));
        });
      }

      // ---- blue card camera: k from card height (522.6 = 1), xL = card left on screen. The punch-in at f354 is a
      // hard cut: the INTEGER frame picks the shot so subframes never blend the two framings
      function cardCam(F, Fi) {
        if (Fi >= 354) {
          const G = Math.max(F, 354);
          const h = tr("blue", G, 3) - tr("blue", G, 2) + 1;
          const k = clamp(h / 522.6, 0.9, 1.05);
          const xL = G >= 395 ? tr("blue", G, 0) : -1155.2 + tr("pan", G);
          return { k, xL, cy: 940.6 };
        }
        const G = Math.min(Math.max(F, 316), 353), G2 = Fi === 353 && F > 353 ? F : G;
        let x0 = tr("blue", G, 0), x1 = tr("blue", G, 1), y0 = tr("blue", G, 2), y1 = tr("blue", G, 3);
        if (G2 > 353) { const d = G2 - 353; x0 += d * 17; x1 += d * 17; } // keep panning through the last subframes
        const h = y1 - y0 + 1, k = h / 522.6;
        return { k, xL: x0, cy: (y0 + y1) / 2, w: x1 - x0 + 1, h };
      }
      function drawCard(F, Fi) {
        const on = Fi >= 316;
        show(cardWrap, on); show(star, Fi >= 314 && Fi <= 450);
        if (Fi >= 314) drawStar(F, Fi);
        if (!on) return;
        const c = cardCam(F, Fi);
        let W, H = 522.6, R;
        if (Fi < 329) { W = c.w / c.k; R = H / 2; } else { W = 1831; R = 150; }
        cardWrap.style.width = card.style.width = W + "px";
        cardWrap.style.transform = `translate(${c.xL}px,${c.cy - H / 2 * c.k}px) scale(${c.k})`;
        const rr = Fi < 322 ? H / 2 : kf(F, [[322, H / 2], [330, R, E.sine]]);
        for (const e of [card, cardGlass, cardRim]) e.style.borderRadius = rr + "px";
        // glass: light blue mixed over the final gradient at the measured fraction (body #cbdbfe f324 -> #6496fa f340)
        // glass over the saturated gradient: the small blob is still fairly blue (body #9ebbf9 f318 -> #b9d1fc f322),
        // lightest while it stretches (f324-328), then the gradient shows through again (#6496fa f340)
        cardGlass.style.opacity = kf(F, [[316, 0.6], [318, 0.65, E.lin], [320, 0.77, E.lin], [322, 0.84, E.lin], [326, 0.88, E.lin], [328, 0.88], [332, 0.59, E.lin], [336, 0.32, E.lin], [340, 0.06, E.lin], [342, 0, E.lin]]);
        // saturated rim ~14 px on screen whatever the scale (ref f322: #8baffe a few px inside the blob edge)
        const rimB = clamp(14 / c.k, 8, 160);
        cardRim.style.boxShadow = `inset 0 0 ${rimB.toFixed(1)}px ${(rimB * 0.35).toFixed(1)}px ${RIMC}`;
        cardRim.style.opacity = kf(F, [[316, 1], [327, 1], [330, 0.25, E.lin], [332, 0, E.lin]]);
        cardWrap.style.filter = blurf(kf(F, [[316, 6], [320, 3, E.lin], [326, 1.5, E.lin], [332, 0.6, E.lin], [338, 0, E.lin]]));
        // content: title slides in from the lower right (measured white-ink box f342-346), Upgrade rises and grows
        // from the bottom right with a small overshoot (icon box f338-352)
        const tOp = kf(F, [[335, 0], [338, 0.5, E.lin], [341, 1, E.lin]]);
        cTitle.style.opacity = tOp;
        const tdx = cr(F, [[334, 66], [336, 60], [338, 52], [342, 44], [346, 27], [350, 15], [356, 5], [362, 0], [380, 0]]);
        const tdy = cr(F, [[334, 30], [336, 26], [338, 22], [342, 17], [346, 8], [350, 4], [356, 1], [362, 0], [380, 0]]);
        placeCap(cTitle, 340 + tdx, 147.7 + tdy + 4 + 0.7046 * 104 * (1 - LAY.ctf), LAY.ctf);
        cSub.style.opacity = kf(F, [[334, 0], [337, 0.3, E.lin], [341, 1, E.lin]]);
        placeCap(cSub, 331, 265.7 + 0.7046 * 76.6 * (1 - LAY.cfs), LAY.cfs);
        upg.style.opacity = kf(F, [[334, 0], [336, 0.6, E.lin], [338, 1, E.lin]]);
        const udy = cr(F, [[334, 320], [336, 250], [338, 215], [340, 171], [342, 106], [344, 70], [346, 47], [348, 33], [350, 21], [352, 14], [356, 5], [362, 0], [380, 0]]);
        const usc = cr(F, [[334, 0.45], [336, 0.55], [338, 0.7], [340, 0.85], [342, 0.97], [344, 1.04], [346, 1.05], [348, 1.04], [350, 1.02], [352, 0.99], [356, 1.0], [380, 1.0]]);
        upg.style.transformOrigin = "50% 50%";
        upg.style.transform = `translate(0px,${udy}px) scale(${usc})`;
        placeCap(upgT, 152, 58 + 0.7046 * 72 * (1 - LAY.uf), LAY.uf);
      }
      function drawStar(F, Fi) {
        // dark navy star flies in from the right (measured centres f315-330), then rides the card and turns pale
        let x, y, sz, rot, col, bl;
        if (F < 331) {
          x = cr(F, [[313, 1150], [315, 1052], [316, 1018], [317, 972], [318, 918], [319, 862], [320, 790], [321, 712], [322, 640], [323, 580], [324, 530], [325, 490], [326, 455], [327, 425], [328, 400], [329, 382], [330, 366], [331, 352]]);
          y = kf(F, [[314, 963], [322, 971, E.lin], [330, 966, E.lin]]);
          sz = kf(F, [[314, 1.0], [320, 0.85, E.lin], [330, 0.6, E.lin]]);
          rot = kf(F, [[313, -60], [324, 20, E.out2], [331, 0, E.out2]]);
          col = BC([44, 74, 102]); bl = kf(F, [[314, 10], [322, 7, E.lin], [330, 4, E.lin]]);
        } else {
          const c = cardCam(F, Fi);
          const wx = cr(F, [[331, 505], [338, 378], [346, 270], [356, 200], [370, 191]]);
          x = c.xL + wx * c.k; y = c.cy + (263 - 261.3) * c.k;
          sz = c.k * kf(F, [[331, 0.6], [344, 1.0, E.out2]]);
          rot = 0; col = mixc(BC([44, 74, 102]), BC([201, 229, 249]), prog(F, 332, 344, E.sine));
          bl = kf(F, [[331, 4], [346, 0, E.out2]]);
        }
        star.style.transform = `translate(${x - 70}px,${y - 70}px) rotate(${rot}deg) scale(${sz})`;
        starPath.setAttribute("fill", rgb(col));
        star.style.filter = blurf(bl);
        star.style.opacity = kf(F, [[313.5, 0], [315, 1, E.lin]]);
      }

      // ======================================================================================
      function draw(t) {
        if (!LAY.font) fitAll();
        const Fi = Math.min(NF - 1, Math.floor(t * FPS + 1e-4));
        const frac = t * FPS - Fi, shift = (window.MB_SHIFT || 0) * FPS;
        const F = Fi >= 437 ? 437 : Fi + (frac - shift) * SHUTTER; // the reference holds a still from f437
        LSUB = frac - shift;
        drawBackground(F, Fi);
        drawIcon(F, Fi);
        drawPill(F, Fi);
        drawList(F, Fi);
        drawMenu(F, Fi);
        drawSub(F, Fi);
        drawCard(F, Fi);
      }
      const P = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.to(P, { t: DUR, duration: DUR, ease: "none", onUpdate: () => draw(P.t) }, 0);
      window.addEventListener("hf-seek", (e) => draw(e.detail.time));
      document.fonts.ready.then(() => { for (const k in inkCache) delete inkCache[k]; fitAll(); draw(P.t); });
      fitAll();
      draw(0);
      window.__timelines["main"] = tl;
    </script>
