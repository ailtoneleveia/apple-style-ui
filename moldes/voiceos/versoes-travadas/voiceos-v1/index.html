    <script>
      // =====================================================================================
      // dafsq ("fastest concept for VoiceOS", @creatoroly) clone. Every value is a pure function
      // of the frame. Integer frame Fi picks what exists (hard cuts stay hard); continuous F drives
      // motion, so round_mb subframes blur only motion (SHUTTER measured on the vineyard pans: 0.5).
      // Scenes 1-2 share ONE world camera (TR.cam, measured): sky and vineyard plates, docks, pill,
      // text and the message window all live in world coordinates (anchor = reference frame 120).
      // =====================================================================================
      const FPS = 60, NF = 700, DUR = NF / FPS, SHUTTER = 0.5;
      const $ = (id) => document.getElementById(id);
      const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
      const lerp = (a, b, t) => a + (b - a) * t;
      const E = {
        lin: (t) => t,
        out: (t) => 1 - Math.pow(1 - t, 3),
        out2: (t) => 1 - (1 - t) * (1 - t),
        in2: (t) => t * t,
        sine: (t) => 0.5 - 0.5 * Math.cos(Math.PI * t),
      };
      const prog = (F, a, b, e = E.lin) => e(clamp((F - a) / (b - a)));
      function kf(F, keys, ease = E.sine) {
        if (F <= keys[0][0]) return keys[0][1];
        for (let i = 1; i < keys.length; i++) if (F <= keys[i][0]) {
          const [f0, v0] = keys[i - 1], [f1, v1, e] = keys[i];
          return lerp(v0, v1, (e || ease)((F - f0) / (f1 - f0)));
        }
        return keys[keys.length - 1][1];
      }
      // Catmull-Rom through keys: no velocity stop at inner keys (motion-feel rule 1)
      function cr(F, keys) {
        const n = keys.length;
        if (F <= keys[0][0]) return keys[0][1];
        if (F >= keys[n - 1][0]) return keys[n - 1][1];
        let i = 0; while (keys[i + 1][0] < F) i++;
        const p0 = keys[Math.max(i - 1, 0)], p1 = keys[i], p2 = keys[i + 1], p3 = keys[Math.min(i + 2, n - 1)];
        const t = (F - p1[0]) / (p2[0] - p1[0]);
        const m1 = ((p2[1] - p0[1]) / (p2[0] - p0[0] || 1)) * (p2[0] - p1[0]);
        const m2 = ((p3[1] - p1[1]) / (p3[0] - p1[0] || 1)) * (p2[0] - p1[0]);
        const t2 = t * t, t3 = t2 * t;
        return (2 * t3 - 3 * t2 + 1) * p1[1] + (t3 - 2 * t2 + t) * m1 + (-2 * t3 + 3 * t2) * p2[1] + (t3 - t2) * m2;
      }
      // ---- measured tracks: fill gaps once (hold neighbours), sample with linear interpolation
      const TRK = window.TR;
      for (const k in TRK) {
        const v = TRK[k].v; if (!v) continue;
        let last = null; for (let i = 0; i < v.length; i++) { if (v[i] == null) v[i] = last; else last = v[i]; }
        last = null; for (let i = v.length - 1; i >= 0; i--) { if (v[i] == null) v[i] = last; else last = v[i]; }
      }
      function tr(name, F, i) {
        const t = TRK[name], n = t.v.length, x = clamp(F - t.a, 0, n - 1), j = Math.floor(x), k = x - j;
        const A = t.v[j], B = t.v[Math.min(j + 1, n - 1)];
        if (i === undefined) {
          if (Array.isArray(A)) return A.map((a, q) => a + (B[q] - a) * k);
          return A + (B - A) * k;
        }
        return A[i] + (B[i] - A[i]) * k;
      }
      const inTr = (name, F) => F >= TRK[name].a && F <= TRK[name].a + TRK[name].v.length - 1;
      function el(tag, css, parent, html) { const e = document.createElement(tag); if (css) e.style.cssText = css; if (html != null) e.innerHTML = html; parent.appendChild(e); return e; }
      const div = (css, p, html) => el("div", css, p, html);
      const show = (e, on) => { e.style.display = on ? "block" : "none"; };
      const blurf = (b) => (b > 0.05 ? `blur(${b.toFixed(2)}px)` : "none");
      const stage = $("stage");
      const PL = window.PLATES;
      const img = (src, p, css) => { const e = el("img", css || "", p); e.src = src; return e; };
      const placePlate = (e, k) => { const q = PL[k]; e.style.cssText += `;position:absolute;left:${q.x}px;top:${q.y}px;width:${q.w}px;height:${q.h}px`; };

      // =====================================================================================
      // MOLDE: swappable assets (data-composition-variables on <html>), read once.
      // Defaults are the clone, and every swap is the identity at its default (the default
      // takes the clone's own code path), so a render with the defaults is the clone frame for frame.
      // =====================================================================================
      const DECL = JSON.parse(document.documentElement.getAttribute("data-composition-variables"));
      const DEF = Object.fromEntries(DECL.map((d) => [d.id, d.default]));
      const HFV = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
      const V = Object.assign({}, DEF, HFV);
      V.frase_tecla = String(V.frase_tecla).replace(/[.\s]+$/, "");   // no final period: the period is the dot that becomes the logo
      const isDef = (...ks) => ks.every((k) => V[k] === DEF[k]);
      const url = (v) => (v && typeof v === "object" ? v.url : v);   // image variables: "path" or {url}
      const esc = (t) => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      const ident = (x) => x;
      // -- colour: hue rotation in OKLCH towards the new colour (same code as the Satellite molde). Lightness and
      //    chroma keep their place in the measured palette; the reference colour (#d41ea2, top of the Send button)
      //    lands exactly on the new one. Only the pinks/magentas turn (OKLCH hue 305-15 deg, full 320-5).
      const hex = (x) => [0, 2, 4].map((i) => parseInt(x.slice(i, i + 2), 16));
      const lin = (c) => (c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4);
      const gam = (c) => (c <= 0.0031308 ? 12.92 * c : 1.055 * c ** (1 / 2.4) - 0.055);
